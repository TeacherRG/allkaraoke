<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllKaraoke.Party - Redirecting...</title>
    <script>
      // Single Page Application routing fallback for GitHub Pages.
      // Redirects all routes to index.html, preserving the URL path and query string.
      window.location.replace(window.location.origin + '/?redirect=' + encodeURIComponent(window.location.pathname + window.location.search) + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
